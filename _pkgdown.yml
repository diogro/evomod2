url: https://diogro.github.io/evomod2/

# Shared site layout (same in stanimal, indri, grnland, evomod2): build with
# `Rscript pkgdown/build_site.R`; the look is in pkgdown/extra.scss and only
# the accent colour below is per package. The home page is the README.
template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  bslib:
    primary: "#6d3b6e"

home:
  title: "evomod2: evolution of genetic architecture in multivariate traits"
  links:
  - text: Guide for agents (AGENTS.md)
    href: https://github.com/diogro/evomod2/blob/main/AGENTS.md
  - text: Developer notes (DEVELOPMENT.md)
    href: https://github.com/diogro/evomod2/blob/main/DEVELOPMENT.md

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]

articles:
- title: Using evomod2
  navbar: ~
  contents:
  - evomod2
  - architectures
  - mutation-models
- title: Reproducing and testing published results
  navbar: Published results
  contents:
  - melo-marroig-2015
  - jones-burger-arnold-2014
  - fluctuating-environments

reference:
- title: Models
  desc: Genetic architectures, mutation, recombination and life cycles.
  contents:
  - evomod_model
  - architectures
  - random_epsilon
  - pairwise_epsilon
  - mutation
  - recombination
  - life_cycles
- title: Selection regimes and simulation
  contents:
  - regimes
  - evolve
  - plot.evomod_population
- title: Recorded statistics and genomes
  contents:
  - statistics
  - genomes
- title: Analysis
  desc: G matrix decomposition, mutational covariance and matrix statistics.
  contents:
  - g_decomposition
  - shuffle_genomes
  - mutational_covariance
  - additive_covariance
  - avg_corr
  - matrix_statistics
- title: Package
  contents:
  - evomod2-package
